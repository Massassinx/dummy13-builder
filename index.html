<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Dummy 13 Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Customize Your Dummy 13</h1>

<div class="builder">
  <h2>Base Price: $20</h2>

  <h3>Add-ons</h3>
  <label><input type="checkbox" value="10" class="addon"> Tentacles (+$10)</label><br>
  <label><input type="checkbox" value="3" class="addon"> Extra Arms (+$3)</label><br>
  <label><input type="checkbox" value="7" class="addon"> Armor Plates (+$7)</label><br>
  <label><input type="checkbox" value="5" class="addon"> Wings (+$5)</label><br>

  <h3>Color</h3>
  <select id="color">
    <option value="White">White</option>
    <option value="Black">Black</option>
    <option value="Red">Red</option>
    <option value="Blue">Blue</option>
  </select>

  <h3>Shipping</h3>
  <label><input type="checkbox" id="shipping"> USA Shipping (+$8)</label><br>

  <h3>Notes</h3>
  <textarea placeholder="Custom requests, size, color details..."></textarea>

  <h2>Total: $<span id="total">20</span></h2>

  <a href="YOUR_GOOGLE_FORM_LINK" target="_blank">
    <button>Submit Order</button>
  </a>
</div>

<h2>Gallery</h2>
<div class="gallery">
  <img src="https://i.imgur.com/YhQxJ0y.png" alt="Dummy 13 1">
  <img src="https://i.imgur.com/7Ew1pXa.png" alt="Dummy 13 2">
  <img src="https://i.imgur.com/6j2SxT6.png" alt="Dummy 13 3">
</div>

<script src="script.js"></script>
</body>
</html>
