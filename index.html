<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Dummy 13 Builder</title>

<!-- Three.js for 3D model -->
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/loaders/GLTFLoader.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Customize Your Dummy 13</h1>

<div class="builder">

  <h2>Base Price: $20</h2>

  <h3>Add-ons</h3>
  <label><input type="checkbox" value="5" class="addon"> Tentacles (+$5)</label><br>
  <label><input type="checkbox" value="3" class="addon"> Extra Arms (+$3)</label><br>
  <label><input type="checkbox" value="7" class="addon"> Armor Plates (+$7)</label><br>
  <label><input type="checkbox" value="10" class="addon"> Wings (+$10)</label><br>

  <h3>Color</h3>
  <select id="color">
    <option value="white">White</option>
    <option value="black">Black</option>
    <option value="red">Red</option>
    <option value="blue">Blue</option>
  </select>

  <h3>Shipping</h3>
  <label><input type="checkbox" id="shipping"> USA Shipping (+$8)</label><br>

  <h3>Notes</h3>
  <textarea placeholder="Custom requests, size, color details..."></textarea>

  <h2>Total: $<span id="total">20</span></h2>

  <a href="YOUR_GOOGLE_FORM_LINK" target="_blank">
    <button>Submit Order</button>
  </a>

</div>

<h2>3D Preview</h2>
<div id="preview" style="width: 400px; height: 400px; border: 1px solid #ccc;"></div>

<script src="script.js"></script>
</body>
</html>
